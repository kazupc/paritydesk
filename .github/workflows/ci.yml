name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Use the Go that setup-go installs; never download another toolchain.
  GOTOOLCHAIN: local

jobs:
  checks:
    name: checks (gofmt, no network, vet)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          # The newest 1.26 patch release, so govulncheck sees a patched
          # standard library (go.mod only names the minimum, 1.26.0).
          go-version: '1.26.x'
          check-latest: true

      - name: gofmt
        run: scripts/ci/check-gofmt.sh

      - name: No network packages (go list -deps)
        run: scripts/ci/check-no-network.sh

      - name: go vet (darwin and linux)
        run: |
          GOOS=darwin go vet ./...
          GOOS=linux go vet ./...

  linux:
    name: test (ubuntu-latest, portable packages)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # The policy tests list files with git ls-files.
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.26.x'
          check-latest: true

      - name: go vet
        run: go vet ./...

      - name: go test -race (packages that do not need macOS)
        # scripts/ci/linux-packages.sh leaves out the packages whose tests
        # drive the macOS-only filesystem layer.
        run: go test -race -count=1 $(scripts/ci/linux-packages.sh)

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Apple silicon and Intel: the binary ships for both.
        os: [macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # The policy tests list files with git ls-files.
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.26.x'
          check-latest: true

      - name: go vet
        run: go vet ./...

      - name: gofmt
        run: scripts/ci/check-gofmt.sh

      - name: Install shellcheck
        # internal/cli runs shellcheck on the integration scripts and the
        # generated bash completion; without it those checks skip.
        env:
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: brew install shellcheck

      - name: go test -race
        # Tests never touch the real app: PARITYDESK_E2E stays unset.
        run: go test -race -count=1 ./...

      - name: go test under a network-deny sandbox
        # Every test binary runs under sandbox-exec with all network
        # denied. TestNetworkDenied (internal/e2e) proves the sandbox
        # works: a loopback listen and dial must fail with a permission
        # error. Modules are already in the cache, so GOPROXY is off.
        env:
          PARITYDESK_NONET_PROBE: '1'
          GOPROXY: 'off'
        run: go test -count=1 -exec "$GITHUB_WORKSPACE/scripts/ci/nonet-exec.sh" ./...

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

  leveldb-differential:
    name: leveldb differential (C++ LevelDB)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.26.x'
          check-latest: true

      - name: Install the C++ LevelDB and Snappy
        env:
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: brew install leveldb snappy

      - name: Build the C++ helper
        run: scripts/ci/build-leveldb-cxx.sh "$RUNNER_TEMP/leveldb-cxx"

      - name: Differential test
        env:
          PARITYDESK_LEVELDB_CXX: ${{ runner.temp }}/leveldb-cxx
        run: go test -race -count=1 -v -run 'TestDifferential' ./internal/store/kv/leveldb/

  e2e:
    name: e2e (stub app)
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.26.x'
          check-latest: true

      - name: Build paritydesk and the stub app
        # Builds paritydesk, the e2e test binary and the stub app (test
        # bundle id, never the real one) and installs the stub as
        # Applications/Claude.app in a temporary HOME. The script refuses
        # to run outside CI or next to the real app.
        env:
          PARITYDESK_E2E_BUNDLE_ID: dev.paritydesk.stubapp
        run: scripts/ci/e2e.sh prepare

      - name: Apple Events diagnostic
        # Launches the installed stub (nothing new is built) and sends it
        # two harmless Apple Events (reopen, count windows) from osascript:
        # outside any sandbox, under an allow-all sandbox-exec profile and
        # under the network-deny profile the tests use, with a Finder
        # "count windows" as the control (the runner image pre-grants
        # Automation for osascript to Finder). It prints each exit code
        # and error, the runner user's AppleEvents TCC rows and the TCC,
        # appleeventsd and sandbox log lines, writes a job summary, and
        # sets the outputs the test step reads. It always exits 0 unless
        # it is misused.
        id: ae1
        env:
          PARITYDESK_E2E_BUNDLE_ID: dev.paritydesk.stubapp
        run: scripts/ci/e2e.sh probe before-grant

      - name: Grant Automation for the stub (GitHub-hosted runner only)
        # Only when the stub launched but Apple Events did not reach it
        # outside the sandbox. Adds kTCCServiceAppleEvents rows for the
        # stub's bundle id to the runner user's TCC.db with sqlite3, in
        # the format and for the clients the runner image itself uses for
        # Finder and System Events (actions/runner-images,
        # images/macos/scripts/build/configure-tccdb-macos.sh). It touches
        # only this disposable runner, never runs on a self-hosted one,
        # and never fails the job; the next diagnostic shows whether tccd
        # honours the rows.
        id: grant
        if: steps.ae1.outputs.stub_launched == '1' && steps.ae1.outputs.outside != 'ok'
        env:
          PARITYDESK_E2E_BUNDLE_ID: dev.paritydesk.stubapp
        run: scripts/ci/e2e.sh grant-tcc

      - name: Apple Events diagnostic after the grant
        id: ae2
        if: steps.grant.outcome == 'success'
        env:
          PARITYDESK_E2E_BUNDLE_ID: dev.paritydesk.stubapp
        run: scripts/ci/e2e.sh probe after-grant

      - name: Stub-app end-to-end tests
        # Drives the real paritydesk binary against the stub. The last
        # diagnostic decides the sandbox: PARITYDESK_E2E_NONET is 1 when
        # Apple Events reach the stub inside the network-deny sandbox;
        # then the tests and every paritydesk run they start run under it.
        # Otherwise they run without sandbox-exec, and the log and summary
        # say so: those paritydesk runs are then not network-denied, and
        # no other job drives the built binary under the sandbox (the
        # checks job only proves there are no network packages; the macOS
        # test job's network-deny run skips the stub-app tests).
        # A skip fails the job unless both the diagnostic showed that the
        # runner refuses Apple Events to the running stub in a way the
        # stub cannot cause (PARITYDESK_E2E_RUNNER_BLOCKS_AE) and a
        # maintainer has set the repository variable
        # PARITYDESK_E2E_ALLOW_SKIP to 1. Such a skip is a warning and a
        # "NOT RUN" line in the summary, nothing was tested, and the tests
        # must be run by hand before a release (docs/release-checklist.md).
        env:
          PARITYDESK_E2E_BUNDLE_ID: dev.paritydesk.stubapp
          PARITYDESK_E2E_NONET: ${{ steps.ae2.outputs.e2e_nonet || steps.ae1.outputs.e2e_nonet }}
          PARITYDESK_E2E_RUNNER_BLOCKS_AE: ${{ steps.ae2.outputs.runner_blocks_ae || steps.ae1.outputs.runner_blocks_ae }}
          PARITYDESK_E2E_ALLOW_SKIP: ${{ vars.PARITYDESK_E2E_ALLOW_SKIP }}
        run: scripts/ci/e2e.sh run
