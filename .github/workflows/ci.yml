name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Use the Go that setup-go installs; never download another toolchain.
  GOTOOLCHAIN: local

jobs:
  checks:
    name: checks (gofmt, no network, vet)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          # The newest 1.26 patch release, so govulncheck sees a patched
          # standard library (go.mod only names the minimum, 1.26.0).
          go-version: '1.26.x'
          check-latest: true

      - name: gofmt
        run: scripts/ci/check-gofmt.sh

      - name: No network packages (go list -deps)
        run: scripts/ci/check-no-network.sh

      - name: go vet (darwin and linux)
        run: |
          GOOS=darwin go vet ./...
          GOOS=linux go vet ./...

  linux:
    name: test (ubuntu-latest, portable packages)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # The policy tests list files with git ls-files.
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.26.x'
          check-latest: true

      - name: go vet
        run: go vet ./...

      - name: go test -race (packages that do not need macOS)
        # scripts/ci/linux-packages.sh leaves out the packages whose tests
        # drive the macOS-only filesystem layer.
        run: go test -race -count=1 $(scripts/ci/linux-packages.sh)

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Apple silicon and Intel: the binary ships for both.
        os: [macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # The policy tests list files with git ls-files.
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.26.x'
          check-latest: true

      - name: go vet
        run: go vet ./...

      - name: gofmt
        run: scripts/ci/check-gofmt.sh

      - name: Install shellcheck
        # internal/cli runs shellcheck on the integration scripts and the
        # generated bash completion; without it those checks skip.
        env:
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: brew install shellcheck

      - name: go test -race
        # Tests never touch the real app: PARITYDESK_E2E stays unset.
        run: go test -race -count=1 ./...

      - name: go test under a network-deny sandbox
        # Every test binary runs under sandbox-exec with all network
        # denied. TestNetworkDenied (internal/e2e) proves the sandbox
        # works: a loopback listen and dial must fail with a permission
        # error. Modules are already in the cache, so GOPROXY is off.
        env:
          PARITYDESK_NONET_PROBE: '1'
          GOPROXY: 'off'
        run: go test -count=1 -exec "$GITHUB_WORKSPACE/scripts/ci/nonet-exec.sh" ./...

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

  leveldb-differential:
    name: leveldb differential (C++ LevelDB)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.26.x'
          check-latest: true

      - name: Install the C++ LevelDB and Snappy
        env:
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
        run: brew install leveldb snappy

      - name: Build the C++ helper
        run: scripts/ci/build-leveldb-cxx.sh "$RUNNER_TEMP/leveldb-cxx"

      - name: Differential test
        env:
          PARITYDESK_LEVELDB_CXX: ${{ runner.temp }}/leveldb-cxx
        run: go test -race -count=1 -v -run 'TestDifferential' ./internal/store/kv/leveldb/

  e2e:
    name: e2e (stub app)
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.26.x'
          check-latest: true

      - name: Stub-app end-to-end tests
        # Builds paritydesk and the stub app (test bundle id, never the
        # real one), installs the stub in a temporary HOME and drives the
        # real binary against it, under the network-deny sandbox. The
        # script refuses to run outside CI or next to the real app.
        env:
          PARITYDESK_E2E_BUNDLE_ID: dev.paritydesk.stubapp
          PARITYDESK_E2E_NONET: '1'
        run: scripts/ci/e2e.sh
