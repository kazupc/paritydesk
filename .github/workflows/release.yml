name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: test before release
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          # Go 1.26.0 has standard library vulnerabilities (GO-2026-6088,
          # GO-2026-4602) that govulncheck reports; build with the newest
          # 1.26 patch release.
          go-version: '1.26.x'
          check-latest: true

      - name: Install shellcheck
        # The integration script tests skip without it.
        run: brew install shellcheck

      - name: go vet
        run: go vet ./...

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go test -race
        # Tests never touch the real app: PARITYDESK_E2E stays unset.
        run: go test -race -count=1 ./...

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

  release:
    name: goreleaser
    needs: test
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      # Only this job may create the draft release and upload its assets.
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # GoReleaser needs the tags and the commit dates.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.26.x'
          check-latest: true

      - name: GoReleaser
        # Pinned by version; the Go checksum database verifies the module.
        run: go run github.com/goreleaser/goreleaser/v2@v2.18.3 release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
